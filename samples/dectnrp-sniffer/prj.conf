CONFIG_KERNEL_BIN_NAME="sample-dectnrp-sniffer"
CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING="sample-dectnrp-sniffer"
CONFIG_ASSERT=y
CONFIG_TFM_PROFILE_TYPE_MINIMAL=y

# Networking / DECT NR+ driver (as in the dectnrp-driver sample)
CONFIG_NETWORKING=y
CONFIG_NET_L2_DUMMY=y
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_DECTNRP_DRIVER_NRF91X1=y
CONFIG_DECTNRP_DRIVER_NRF91X1_CAP_LOGGING=n
CONFIG_DECTNRP_DRIVER_SCHEDULED_API=y
CONFIG_DECTNRP_DRIVER_BLOCKING_API=n

# The UART carries the binary sniffer stream, so the console is disabled.
# Log messages go to RTT, as in the dectnrp-driver sample.
CONFIG_BOOT_BANNER=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
CONFIG_LOG_BACKEND_RTT_MODE_OVERWRITE=y

CONFIG_DECTNRP_SNIFFER_DEFAULT_CHANNEL=1677
CONFIG_DECTNRP_SNIFFER_DEFAULT_NETWORK_ID=0x32545279
CONFIG_DECTNRP_SNIFFER_WINDOW_MS=1000
